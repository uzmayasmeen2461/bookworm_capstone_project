# ── BookWorm — Render Blueprint ────────────────────────────────────────────────
# Deploys the full BookWorm stack to Render.com from a single file.
#
# Services created:
#   bookworm-backend      — Node.js API   (Web Service, Docker)
#   bookworm-shell        — Shell SPA     (Web Service, Docker)
#   bookworm-mfe-auth     — Auth MFE      (Web Service, Docker)
#   bookworm-mfe-store    — Store MFE     (Web Service, Docker)
#   bookworm-mfe-checkout — Checkout MFE  (Web Service, Docker)
#   bookworm-db           — PostgreSQL    (Render managed database)
#
# HOW TO DEPLOY:
#   1. Push this repo to GitHub (public or private).
#   2. Go to https://dashboard.render.com/blueprints
#   3. Click "New Blueprint Instance" → connect your repo → select this file.
#   4. Render will ask you to fill in vars marked  sync: false  — enter them.
#      Generate secrets with:
#        node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
#   5. After the first deploy copy the 5 *.onrender.com URLs and update:
#        bookworm-backend  → ALLOWED_ORIGINS  (all 4 frontend URLs, comma-separated)
#        bookworm-shell    → MFE_AUTH_URL / MFE_STORE_URL / MFE_CHECKOUT_URL
#      Then click "Manual Deploy" on bookworm-shell.
#
# PATH NOTE:
#   The repo root is capstone_project/ and the app lives in capstone_project/bookworm/.
#   All dockerContext and dockerfilePath values are relative to the repo root,
#   so they all carry the bookworm/ prefix.
# ─────────────────────────────────────────────────────────────────────────────

databases:
  - name: bookworm-db
    databaseName: bookworm
    user: bookworm
    plan: free

services:

  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: bookworm-backend
    runtime: docker
    dockerfilePath: ./bookworm/backend/Dockerfile
    dockerContext: ./bookworm/backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: bookworm-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: bookworm-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: bookworm-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: bookworm-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bookworm-db
          property: password
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Fill in after first deploy — comma-separated list of all 4 frontend URLs
      # e.g. https://bookworm-shell.onrender.com,https://bookworm-mfe-auth.onrender.com,...
      - key: ALLOWED_ORIGINS
        sync: false

  # ── Shell SPA ────────────────────────────────────────────────────────────────
  # dockerContext is bookworm/ (monorepo root) so the Dockerfile can COPY shared/
  - type: web
    name: bookworm-shell
    runtime: docker
    dockerfilePath: ./bookworm/shell/Dockerfile
    dockerContext: ./bookworm
    plan: free
    envVars:
      # These are forwarded as Docker ARGs at build time.
      # Update to your actual *.onrender.com URLs after first deploy,
      # then trigger a manual redeploy on this service.
      - key: MFE_AUTH_URL
        value: https://bookworm-mfe-auth.onrender.com
      - key: MFE_STORE_URL
        value: https://bookworm-mfe-store.onrender.com
      - key: MFE_CHECKOUT_URL
        value: https://bookworm-mfe-checkout.onrender.com
      - key: API_BASE_URL
        value: https://bookworm-backend-275c.onrender.com

  # ── mfe-auth ─────────────────────────────────────────────────────────────────
  - type: web
    name: bookworm-mfe-auth
    runtime: docker
    dockerfilePath: ./bookworm/mfe-auth/Dockerfile
    dockerContext: ./bookworm
    plan: free
    envVars:
      - key: API_BASE_URL
        value: https://bookworm-backend-275c.onrender.com

  # ── mfe-store ────────────────────────────────────────────────────────────────
  - type: web
    name: bookworm-mfe-store
    runtime: docker
    dockerfilePath: ./bookworm/mfe-store/Dockerfile
    dockerContext: ./bookworm
    plan: free
    envVars:
      - key: API_BASE_URL
        value: https://bookworm-backend-275c.onrender.com

  # ── mfe-checkout ─────────────────────────────────────────────────────────────
  - type: web
    name: bookworm-mfe-checkout
    runtime: docker
    dockerfilePath: ./bookworm/mfe-checkout/Dockerfile
    dockerContext: ./bookworm
    plan: free
    envVars:
      - key: API_BASE_URL
        value: https://bookworm-backend-275c.onrender.com
