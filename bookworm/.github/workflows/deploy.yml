name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  deploy:
    name: SSH deploy to VPS
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. SSH into the server and run deploy.sh ────────────────────────────
      # Secrets required in GitHub → Settings → Secrets → Actions:
      #   VPS_HOST        — server IP or hostname (e.g. 123.45.67.89)
      #   VPS_USER        — deploy user on the server (e.g. bookworm)
      #   VPS_SSH_KEY     — private SSH key whose public key is in ~/.ssh/authorized_keys
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.VPS_HOST }}
          username:    ${{ secrets.VPS_USER }}
          key:         ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            APP_DIR=/opt/bookworm bash /opt/bookworm/bookworm/scripts/deploy.sh

      # ── 3. Verify the deployment is reachable ───────────────────────────────
      - name: Smoke test
        run: |
          echo "Waiting 15 s for containers to settle..."
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://${{ secrets.VPS_DOMAIN }}/api/health" || echo "000")
          echo "Health endpoint returned HTTP ${STATUS}"
          if [ "${STATUS}" != "200" ]; then
            echo "::error::Smoke test failed — /api/health returned ${STATUS}"
            exit 1
          fi
          echo "✓ Deployment healthy"
        env:
          VPS_DOMAIN: ${{ secrets.VPS_DOMAIN }}
